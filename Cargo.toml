[package]
edition = "2021"
name = "xosms"
version = "0.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Default enable napi4 feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "3.8.4", default-features = false, features = ["napi9", "async"] }
napi-derive = "3.5.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.54.0", features = ["Foundation", "Media", "Media_Playback", "Storage", "Storage_Streams"] }
dashmap = "5.5.3"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9.10", features = ["vendored"] }
dbus-tokio = "0.7.6"
dbus-crossroads = "0.5.2"
dashmap = "5.5.3"
float_duration = { version = "0.3.3", default-features = false }
oneshot = "0.1.6"
tokio = { version = "1.50.0", features = ["rt", "macros"] }

[build-dependencies]
napi-build = "2.0.1"

[profile.release]
lto = true
strip = "symbols"
